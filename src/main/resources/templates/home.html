<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>WSL Football Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #251846;
            background: linear-gradient(
                135deg,
                #2e0854,
                #6c2076,
                #aa8ac7
            ) ;
        }

        header {
            color: #fff;
            padding: 35px 20px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 38px;
            margin: 0;
        }

        header p {
            color: #eadcff;
            margin-top: 10px;
        }

        .dashboard {
            display: grid;
            grid-template-columns: minmax(0, 2fr) minmax(240px, 1fr);
            gap: 24px;
            max-width: 1250px;
            margin: 0 auto;
            padding: 25px;
        }

        .card {
            background: #fff;
            border-radius: 18px;
            padding: 24px;
            box-shadow: 0 12px 30px rgba(20, 0, 40, 0.25
            );
        }

        h2 {
            margin-top: 0;
            color: #4b126e;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            padding: 12px 9px;
            color: #fff;
            background: #5b168c;
            text-align: center;
        }

        td {
            padding: 11px 9px;
            text-align: center;
            border-bottom: 1px solid #e7dcf0;
        }

        tbody tr:hover {
            background: #f5edff;
        }

        .team-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .team-list li {
            margin-bottom: 10px;
        }

        .team-list a{
            display: block;
            padding: 12px;
            color:#4b126e;
            background: #f4eaff;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
            transition: 0.2s;
        }

        .team-list a:hover {
            color: #fff;
            background: #6f24a8;
            transform: translateX(4px);
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }

            .table-wrapper {
                overflow-x: auto;
            }
        }

    </style>
</head>

<body>

<header>

    <h1>WSL Football Tracker</h1>
    <p>League Standings and 2026 Match Results</p>

</header>

<main class="dashboard">

    <section class="card">
        <h2>League Table</h2>

        <div class="table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th>Pos</th>
                        <th>Team</th>
                        <th>P</th>
                        <th>W</th>
                        <th>D</th>
                        <th>L</th>
                        <th>Pts</th>
                    </tr>
                </thead>

                <tbody>
                    <tr th:each="entry, position : ${leagueTable}">
                        <td th:text="${position.count}"></td>
                        <td th:text="${entry.teamName}"></td>
                        <td th:text="${entry.played}"></td>
                        <td th:text="${entry.won}"></td>
                        <td th:text="${entry.drawn}"></td>
                        <td th:text="${entry.lost}"></td>
                        <td th:text="${entry.points}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </section>

    <aside class="card">
        <h2>Teams</h2>

        <ul class="team-list">
            <li th:each="team : ${teams}">
                <a th:href="@{'/team/' + ${team.id}}"
                th:text="${team.name}">
                Team name
                </a>
            </li>
        </ul>
    </aside>

</main>

</body>

</html>
